# Reverse proxy for the two Nuxt instances.
#   /staging/    -> staging container  (sandbox.tgbp.io, solana-devnet)
#   /production/ -> production container (api.tgbp.io, solana mainnet)
#
# The full request URI is passed through untouched (no path stripping):
# each app is built/started with a matching NUXT_APP_BASE_URL.
#
# TLS: certs for onramp.xcavate.io live in ./nginx/certs on the server
# (fullchain.pem + privkey.pem, issued by certbot). nginx will fail to
# start if they are missing.

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

# HTTP: serve ACME challenges, redirect everything else to HTTPS.
server {
  listen 80;
  server_name onramp.xcavate.io _;

  # certbot webroot challenges
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://onramp.xcavate.io$request_uri;
  }
}

# HTTPS
server {
  listen 443 ssl;
  http2 on;
  server_name onramp.xcavate.io;

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;

  location = / {
    return 302 /production/;
  }

  location /staging/ {
    proxy_pass http://app-staging:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 60s;
  }

  location /production/ {
    proxy_pass http://app-production:3002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 60s;
  }

  location / {
    return 404;
  }
}
