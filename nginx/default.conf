# Reverse proxy for the two Nuxt instances.
#   /staging/    -> staging container  (sandbox.tgbp.io, solana-devnet)
#   /production/ -> production container (api.tgbp.io, solana mainnet)
#
# The full request URI is passed through untouched (no path stripping):
# each app is built/started with a matching NUXT_APP_BASE_URL.

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  server_name _;

  # ACME / certbot challenges, if you use certbot with the webroot plugin
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location = / {
    return 302 /production/;
  }

  location /staging/ {
    proxy_pass http://app-staging:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 60s;
  }

  location /production/ {
    proxy_pass http://app-production:3002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 60s;
  }

  location / {
    return 404;
  }
}

